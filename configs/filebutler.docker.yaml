listen: "0.0.0.0:8080"
database_file: "/app/data/filebutler.db"
static_dir: "/app/web/dist"
log_level: "info"
cloud115:
  python: "python3"
  worker: "/app/cloud115/worker.py"
session:
  cookie_name: "filebutler_session"
  secure: false
roots:
  - id: "downloads"
    name: "Downloads"
    path: "/data/downloads"
  - id: "media"
    name: "Media"
    path: "/data/media"
